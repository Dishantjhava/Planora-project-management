version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: planora-backend
    ports:
      - '5001:5000'
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
    container_name: planora-frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
